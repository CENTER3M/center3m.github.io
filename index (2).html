<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CENTER 3M</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style id="css">
/* Layout: dark-only. Deep navy brand band with logo, content cards on near-black blue; one-column app views for tracking and settings */
:root{
  --bg:#0A121B; --surface:#111D29; --surface2:#182838; --fg:#E6EEF6; --muted:#8FA3B7; --line:#22364A;
  --navy:#0D1925; --navy-fg:#F2F7FB; --cyan:#1EC8EF; --mint:#33E6C3; --accent:#3BD3F2; --accent-fg:#06131D;
  --ok:#4FD8A4; --ok-bg:#12352B; --bad:#FF7F77; --bad-bg:#3E1D1C; --late:#F2B85A; --late-bg:#3A2C15; --exc:#9AA6FF; --exc-bg:#222850; --kick:#FF72D2; --kick-bg:#3F1636;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;direction:rtl}
h1,h2,h3{font-family:var(--display);line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-fg);border-bottom:1px solid rgba(255,255,255,.08)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.brand img{width:42px;height:42px;border-radius:10px}
.brand b{font-family:var(--display);letter-spacing:.06em;font-size:15px;direction:ltr}
.nav{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.nav button{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--navy-fg);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px}
.nav button:hover{border-color:var(--mint)}
.nav button.on{background:linear-gradient(90deg,var(--cyan),var(--mint));color:#0B2233;border-color:transparent}

/* hero */
.hero{background:linear-gradient(160deg,#10263A 0%,var(--navy) 60%);border-bottom:1px solid var(--line);color:var(--navy-fg);padding-block:40px 56px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -10% -60% auto;width:60%;aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle,rgba(51,230,195,.18),transparent 65%);pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;position:relative;z-index:1}
.logo-block{display:flex;flex-direction:column;align-items:center;gap:12px}
.logo-block img{width:200px;height:200px;border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.logo-block .en{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.22em;direction:ltr;background:linear-gradient(90deg,var(--cyan),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1{font-size:clamp(28px,4.4vw,44px);font-weight:700}
.hero p.sub{color:#C6D5E2;font-size:18px;max-width:52ch;margin-top:12px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 20px;font-weight:600;cursor:pointer;border:1px solid transparent;text-decoration:none;font-size:15px}
.btn.main{background:linear-gradient(90deg,var(--cyan),var(--mint));color:#0B2233}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.3);color:var(--navy-fg)}
.btn.plain{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.acc{background:var(--accent);color:var(--accent-fg)}
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}

section.block{padding-block:48px 8px}
.eyebrow{color:var(--accent);font-weight:600;font-size:14px;letter-spacing:.02em}
.block h2{font-size:clamp(22px,3vw,30px);margin-top:4px}
.lead{color:var(--muted);max-width:65ch;margin-top:8px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));margin-top:24px}
.feat{padding:20px;border-top:3px solid var(--cyan);background:var(--surface);border-radius:0 0 var(--r) var(--r)}
.feat h3{font-size:18px;margin-bottom:6px}
.feat p{color:var(--muted);font-size:15px}
.teacher{display:flex;gap:14px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.teacher .av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#0B2233;background:linear-gradient(135deg,var(--cyan),var(--mint))}
.teacher b{display:block;font-family:var(--display)}
.teacher span{color:var(--muted);font-size:14px}
.news{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.news-item{display:flex;gap:14px;padding:14px 16px;background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.news-item time{flex:none;color:var(--accent);font-weight:600;font-size:14px;min-width:84px}
.track-promo{margin-top:48px;background:linear-gradient(120deg,#10263A,#14455C);border:1px solid var(--line);color:var(--navy-fg);border-radius:20px;padding:28px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.track-promo h2{font-size:24px}
.track-promo p{color:#C6D5E2;margin-top:6px}
.contact{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));margin-top:20px}
.contact div{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.contact small{display:block;color:var(--muted)}
.contact b{font-weight:600;user-select:all;overflow-wrap:anywhere}
footer{margin-top:56px;padding-block:28px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;background:var(--navy)}
footer .wrap{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
footer .owner{font-family:var(--display);color:var(--fg);letter-spacing:.04em;direction:ltr;font-weight:600}
footer .yrs{direction:ltr;font-variant-numeric:tabular-nums}
footer .staff{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;margin-top:6px}
.auth{max-width:420px;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px}
.auth .logo{width:72px;height:72px;border-radius:16px;align-self:center}
.auth h2{text-align:center;font-size:22px}
.auth p{text-align:center}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--accent)}
.perms{display:flex;flex-wrap:wrap;gap:6px 14px}
.perms label{display:flex;gap:6px;align-items:center;font-size:14px}
.warn{background:var(--late-bg);color:var(--late);padding:12px 14px;border-radius:12px;font-size:15px}

/* tracking */
.page{padding-block:32px 64px}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:8px 24px}
.intro img{width:120px;height:120px;border-radius:24px;box-shadow:0 18px 44px rgba(0,0,0,.45)}
.intro .en{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.22em;direction:ltr;background:linear-gradient(90deg,var(--cyan),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro h1{font-size:clamp(26px,4.4vw,40px);margin-top:6px}
.intro p{color:var(--muted);max-width:46ch}
.owner-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-block:2px 4px}
.owner-links .fb,.owner-ph{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:13px;text-decoration:none;cursor:pointer;font-family:inherit}
.owner-links .fb{color:#7EA6FF}
.owner-links .fb:hover,.owner-ph:hover{border-color:var(--accent)}
.owner-ph small{color:var(--accent)}
.anns{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:20px auto 0}
.ann{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--late);border-radius:12px;padding:12px 14px}
.ann p{font-weight:500;white-space:pre-line}
.ann small{color:var(--muted);font-size:12.5px}
.ann-ic{font-size:18px;line-height:1.4}
.sched{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sched h3{font-size:17px;margin-bottom:10px}
.sched-list{display:flex;flex-direction:column;gap:8px}
.sched-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.sched-row.mine{outline:2px solid var(--accent)}
.sched-row .sg{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.sched-row .sd{color:var(--muted);font-size:14px;min-width:0}
.sched-row .st{font-weight:600;color:var(--accent);white-space:nowrap}
.sched-row .sn{grid-column:1/-1;color:var(--late);font-size:14px;font-weight:500}
@media (max-width:520px){.sched-row{grid-template-columns:1fr auto}.sched-row .sd{grid-column:1/-1;order:3}.sched-row .sn{order:4}}
.notice{max-width:640px;margin:22px auto 0;display:flex;gap:12px;align-items:flex-start;background:var(--late-bg);border:1px solid rgba(242,184,90,.35);border-radius:14px;padding:14px 16px}
.notice p{white-space:pre-line;font-weight:500;font-size:16px;line-height:1.8}
.notice-ic{font-size:20px;line-height:1.5}
.media{margin-top:32px}
.media h3{font-size:18px;text-align:center;margin-bottom:12px}
.media-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.media figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.media-img{display:block;width:100%;padding:0;border:0;background:#fff;cursor:zoom-in}
.media-img img{display:block;width:100%;height:auto}
.media figcaption,.lb-fig figcaption{padding:8px 12px;font-size:14px;color:var(--muted);text-align:center}
.lb{place-items:center}
.lb-fig{margin:0;max-width:min(96vw,1100px);max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:8px}
.lb-fig img{max-width:100%;max-height:80vh;border-radius:10px;background:#fff}
.links{margin-top:32px;display:flex;flex-direction:column;align-items:center;gap:10px}
.link-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.link-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;font-weight:500;font-size:14px}
.link-btn:hover{border-color:var(--accent)}
.link-btn svg{color:var(--accent)}
.media-admin{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.media-admin .mi{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.media-admin img{width:100%;height:140px;object-fit:contain;background:#fff}
.media-admin .mi .field{padding:6px 8px}
.ico{flex:none;vertical-align:-3px}
.tabs button{display:inline-flex;align-items:center;gap:7px}
.tabs button .ico{opacity:.75}
.tabs button.on .ico{opacity:1}
.nav button{display:inline-flex;align-items:center;gap:6px}
.panel h3{display:flex;align-items:center;gap:8px}
.panel h3 .ico{color:var(--accent)}
.btn .ico{margin-inline-end:2px}
.footer-staff,.staff{display:inline-flex;align-items:center;gap:6px}
.notice-ic{color:var(--late);display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:rgba(242,184,90,.14);flex:none}
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:28px 16px;border:2px dashed var(--accent);border-radius:16px;background:rgba(59,211,242,.06);cursor:pointer;color:var(--fg)}
.dropzone:hover,.dropzone:focus-within{background:rgba(59,211,242,.12)}
.dropzone .ico{color:var(--accent)}
.dropzone b{font-size:17px}
.dropzone span{color:var(--muted);font-size:14px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.modal h3{display:flex;align-items:center;gap:8px}
.contact-box{margin-top:36px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cb-title{color:var(--muted);font-size:13px;font-weight:500;letter-spacing:.02em}
.phones{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.phone{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--fg);transition:border-color .15s,background .15s}
.phone:hover{border-color:var(--accent);background:var(--surface2)}
.phone b{font-family:var(--display);font-size:15px;font-weight:500;letter-spacing:.04em}
.ph-label{font-size:12.5px;color:var(--accent);font-weight:500;padding-inline-start:8px;border-inline-start:1px solid var(--line)}
.ph-label.big{border:0;padding:0;font-size:14px;margin-top:-4px}
.ph-ic{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--mint));color:#06131D;flex:none}
.modal.pick{max-width:300px;padding:18px;gap:10px;border-color:var(--line);text-align:center;align-items:stretch}
.modal.pick h3{color:var(--muted);font-size:14px;font-weight:500}
.modal .big{font-family:var(--display);font-size:20px;letter-spacing:.05em;margin-bottom:4px}
.pick-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick-row .btn{padding:9px 10px;font-size:14px}
.pick-foot{display:flex;justify-content:center;gap:14px}
.pick-foot button{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px}
.pick-foot button:hover{color:var(--fg)}
.btn.wa{background:#25D366;color:#06210F}
.lookup{margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;max-width:560px}
.lookup form{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:14px;color:var(--muted);font-weight:500}
input[type=text],input[type=password],input[type=tel],input[type=date],input[type=number],input[type=month],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.big-input{font-size:22px;letter-spacing:.15em;text-align:center;direction:ltr;flex:1 1 180px;font-family:var(--display)}
.msg{padding:12px 14px;border-radius:12px;font-size:15px}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.info{background:var(--surface2);color:var(--fg)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.student-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-top:28px}
.student-head h2{font-size:26px}
.student-head .meta{color:var(--muted)}
.scard{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:28px}
.scard div{background:var(--surface);padding:14px 16px;min-width:0}
.scard small{display:block;color:var(--muted);font-size:13px}
.scard b{font-family:var(--display);font-size:20px;overflow-wrap:anywhere}
.scard .stage b{color:var(--accent)}
.btn.kill{background:var(--bad);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(3,8,14,.72);display:grid;place-items:center;z-index:60;padding:16px}
.modal{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--bad);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal h3{color:var(--bad);font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:12px;margin-top:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile small{color:var(--muted);display:block;font-size:13px}
.tile b{font-family:var(--display);font-size:28px}
.tile.k b{color:var(--kick)} .tile.p b{color:var(--ok)} .tile.a b{color:var(--bad)} .tile.l b{color:var(--late)} .tile.e b{color:var(--exc)}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mint))}
.month-bar{display:flex;align-items:center;gap:10px;margin-top:28px;flex-wrap:wrap}
.month-bar h3{font-size:20px;min-width:150px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.cal .dn{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;gap:2px;min-width:0}
.cal .d.x{background:transparent;border-color:transparent}
.cal .d.p{background:var(--ok-bg);border-color:transparent;color:var(--ok);font-weight:600}
.cal .d.a{background:var(--bad-bg);border-color:transparent;color:var(--bad);font-weight:600}
.cal .d.l{background:var(--late-bg);border-color:transparent;color:var(--late);font-weight:600}
.cal .d.k{background:var(--kick-bg);border-color:transparent;color:var(--kick);font-weight:600}
.cal .d.e{background:var(--exc-bg);border-color:transparent;color:var(--exc);font-weight:600}
.cal .d small{font-size:10px;line-height:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle;background:var(--c)}
.log{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.log-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.log-row:first-child{border-top:0}
.log-row .dt b{font-weight:600}
.log-row .dt small{display:block;color:var(--muted);font-size:13px}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.p{background:var(--ok-bg);color:var(--ok)} .chip.a{background:var(--bad-bg);color:var(--bad)}
.chip.k{background:var(--kick-bg);color:var(--kick)} .chip.l{background:var(--late-bg);color:var(--late)} .chip.e{background:var(--exc-bg);color:var(--exc)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* admin */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.tabs button{flex:none;background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--navy);color:var(--navy-fg);border-color:var(--navy)}
.panel{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.panel h3{font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 160px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .grow{flex:1 1 180px;min-width:0}

function shrinkImage(file){return new Promise(function(res,rej){var r=new FileReader();r.onerror=rej;r.onload=function(){var img=new Image();img.onerror=function(){rej(new Error('img'))};img.onload=function(){
  var maxW=1400,q=0.78,out='';for(var k=0;k<8;k++){var sc=Math.min(1,maxW/img.width);var cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);var x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);out=cv.toDataURL('image/jpeg',q);if(out.length<450000)break;if(q>0.55)q-=0.1;else maxW=Math.round(maxW*0.8)}
  if(out.length>=850000)rej(new Error('big'));else res(out)};img.src=r.result};r.readAsDataURL(file)})}

function siteFromDoc(dd,st){if(!dd)return;if(dd.mediaIdx)st.mediaIdx=dd.mediaIdx;if(dd.logo)st.logo=dd.logo;if(dd.site)st.site=dd.site;if(dd.grades)st.grades=dd.grades;if(dd.delPin)st.delPin=dd.delPin}
function applySettings(qs,st){var media=[];qs.forEach(function(doc){var x=doc.data();if(doc.id==='site')siteFromDoc(x,st);else if(doc.id.indexOf('img_')===0&&x&&x.data){media.push({id:doc.id.slice(4),caption:x.caption||'',stage:x.stage||'',data:x.data,order:x.order||0})}});st.media=media}
function loadAll(){
  var q=[db.collection('settings').get(),db.collection('students').get(),db.collection('uploads').orderBy('ts','desc').limit(50).get()];
  if(me.role==='admin'){q.push(db.collection('users').get());loadStats()}
  return Promise.all(q).then(function(r){
    var st=clone(STATE);applySettings(r[0],st);
    var siteRaw=null;r[0].forEach(function(dc){if(dc.id==='site')siteRaw=dc.data()});
    if(siteRaw&&!siteRaw.mediaIdx&&(st.media||[]).length&&(me.role==='admin'||(me.perms||[]).indexOf('site')>=0)){var mi=siteDoc(st).mediaIdx;db.doc('settings/site').set({mediaIdx:mi},{merge:true}).catch(function(){})}
    st.students=[];st.attendance={};st.exams={};
    r[1].forEach(function(doc){var x=doc.data();st.students.push({code:String(x.code||doc.id),name:x.name||'',grade:x.grade||'',group:x.group||'',phone:x.phone||''});if(x.att&&Object.keys(x.att).length)st.attendance[String(x.code||doc.id)]=x.att;if(x.ex&&Object.keys(x.ex).length)st.exams[String(x.code||doc.id)]=x.ex});
    st.students.sort(function(a,b){return (parseInt(a.code,10)||0)-(parseInt(b.code,10)||0)});
    st.uploads=[];r[2].forEach(function(doc){var x=doc.data();delete x.ts;x.id=doc.id;st.uploads.push(x)});
    if(r[3]){st.users=[];r[3].forEach(function(doc){var x=doc.data();x.id=doc.id;st.users.push(x)})}else st.users=[clone(me)];
    STATE=st;S=clone(STATE);dirty=false;dataVer++;
  });
}

function doLogin(){
  var u=val('liUser').trim().toLowerCase(),pw=val('liPass');

  loginBusy=true;loginErr='';render();
  auth.signInWithEmailAndPassword(uEmail(u),pw).then(function(c){return loadMe(c.user.uid)}).then(function(){
    loginBusy=false;view='admin';adminTab='';render();window.scrollTo(0,0);
  }).catch(function(e){me=null;loginBusy=false;loginErr=e&&e.code==='c3m/inactive'?'الحساب ده موقوف، كلم الأدمن':fbErr(e);render();var el=document.getElementById('liUser');if(el)el.value=u});
}
function doSetup(){
  var name=val('suName').trim(),u=val('suUser').trim().toLowerCase(),p1=val('suPass'),p2=val('suPass2');
  if(!/^[a-z0-9._-]{3,30}$/.test(u)){loginErr='اسم المستخدم لازم يكون 3 حروف أو أكتر بالإنجليزي أو أرقام';render();return}
  if(p1.length<6){loginErr='الباسورد لازم يكون 6 أرقام أو أكتر';render();return}
  if(p1!==p2){loginErr='الباسوردين مش زي بعض';render();return}
  loginBusy=true;loginErr='';render();
  var id;
  auth.createUserWithEmailAndPassword(uEmail(u),p1).then(function(c){id=c.user.uid;
    var b=db.batch();b.set(db.doc('meta/setup'),{owner:id,at:firebase.firestore.FieldValue.serverTimestamp()});
    b.set(db.doc('users/'+id),{name:name||u,u:u,role:'admin',perms:PERMS.map(function(p){return p[0]}),active:true});
    return b.commit();
  }).then(function(){return db.doc('settings/site').set({logo:STATE.logo,site:STATE.site,grades:STATE.grades||[],delPin:STATE.delPin||''})})
  .then(function(){setupDone=true;return loadMe(id)}).then(function(){loginBusy=false;view='admin';adminTab='backup';render();toast('اتعمل حساب الأدمن. ارفع ملف البيانات من هنا')})
  .catch(function(e){loginBusy=false;loginErr=fbErr(e);render()});
}

function skippedHtml(r){if(!r.skipped.length)return '';

function nameOf(code){var s=(S.students||[]).find(function(x){return String(x.code)===String(code)});return s?s.name:''}

var AR_DIG='٠١٢٣٤٥٦٧٨٩',FA_DIG='۰۱۲۳۴۵۶۷۸۹';
function digits(s){return String(s).replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069]/g,'').replace(/[٠-٩]/g,function(d){return AR_DIG.indexOf(d)}).replace(/[۰-۹]/g,function(d){return FA_DIG.indexOf(d)})}
function normAr(s){return digits(String(s==null?'':s).normalize('NFKC')).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim().toLowerCase()}
function toStatus1(s){
  if(!s)return null;
  if(/طرد|مطرود|اتطرد|kick|expel|^ط$/.test(s))return 'k';
  if(/بعذر|عذر|معتذر|excused|^e$/.test(s))return 'e';
  if(/متاخر|تاخير|تاخر|late|^l$|^م$/.test(s))return 'l';
  if(/غائب|غايب|غياب|absent|^a$|^غ$|^x$|✗|✘|×|❌|^0$|^لا$|^no$/.test(s))return 'a';
  if(/حاضر|حضر|حضور|present|^p$|^ح$|✓|✔|✅|^1$|^نعم$|^yes$|^v$/.test(s))return 'p';
  return null;
}
function toStatus(v){if(v==null||v==='')return null;var s=normAr(v);if(!s)return null;return toStatus1(s)||toStatus1(s.split('').reverse().join(''))}
function ymd(y,m,d){if(m<1||m>12||d<1||d>31||y<2000||y>2100)return null;return y+'-'+pad(m)+'-'+pad(d)}
function toDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v)){var t=new Date(v.getTime()+12*36e5);return ymd(t.getFullYear(),t.getMonth()+1,t.getDate())}
  if(typeof v==='number'){if(v>30000&&v<70000){var u=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return ymd(u.getUTCFullYear(),u.getUTCMonth()+1,u.getUTCDate())}return null}
  var s=digits(String(v)).trim(),m;
  if(m=s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return ymd(+m[1],+m[2],+m[3]);
  if(m=s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)){var y=+m[3];if(y<100)y+=2000;return ymd(y,+m[2],+m[1])}
  if(m=s.match(/^(\d{1,2})[-\/](\d{1,2})$/))return ymd(new Date().getFullYear(),+m[2],+m[1]);
  return null;
}
function fixName(n){return String(n||'').replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069]/g,'').replace(/\s+([\u064B\u064C])/g,'$1').replace(/دمحم/g,'محمد').replace(/هللا/g,'الله').replace(/باهلل/g,'بالله').replace(/\u064C/g,'ي').replace(/\u064B(?=\s|$)/g,'ي').replace(/\s+/g,' ').trim()}
function detectGrade(text){var s=normAr(text),n=0,stg='';
  var m=s.match(/(^|[^\d])([123])\s*(ث|ع|ثانوي|اعدادي|الثانوي|الاعدادي)(?![\u0600-\u06FF])/);
  if(m){n=+m[2];stg=/ث/.test(m[3])?'ثانوي':'اعدادي'}
  else{var w=s.match(/(الاولي|الاول|اولي|اول|الثانيه|الثاني|ثانيه|تانيه|تاني|الثالثه|الثالث|ثالثه|تالته|تالت)\s+(الصف\s+)?(ثانوي|الثانوي|اعدادي|الاعدادي|ث|ع)(?![\u0600-\u06FF])/);
    if(w){n=/اول/.test(w[1])?1:/(ثان|تان)/.test(w[1])?2:3;stg=/ث/.test(w[3])?'ثانوي':'اعدادي'}}
  if(!n)return '';
  var ord=['الاول','الثاني','الثالث'][n-1];
  return (S.grades||[]).find(function(g){var x=normAr(g);return x.indexOf(ord)>=0&&x.indexOf(stg)>=0})||''}
function cleanCode(v){if(v==null)return '';if(typeof v==='number')return String(Math.round(v));var s=digits(String(v)).replace(/\s+/g,'').trim();if(/^\d+\.0+$/.test(s))s=s.replace(/\.0+$/,'');return s}
function isCodeTok(s){return /^\d{2,8}$/.test(s)}

/* Excel / CSV: header-based table, with section titles (الحضور / الغياب) */
var LABEL_RE=/^(عدد|المجموع|اجمالي|الاجمالي|الماده|المدرس|اليوم|الوقت|الصف|المجموعه|total)/;
function sectionOf(r){var cells=(r||[]).filter(function(c){return String(c).trim()!==''});if(cells.length!==1)return null;var t=normAr(cells[0]);
  if(/^(ال)?(حضور|حاضرين|الحاضرون)$/.test(t))return 'p';if(/^(ال)?(غياب|غائبين|الغائبون)$/.test(t))return 'a';if(/^(ال)?(متاخرين|تاخير)$/.test(t))return 'l';if(/^(ال)?(اعذار|غياب بعذر)$/.test(t))return 'e';if(/^(ال)?(مطرودين|المطرودين|طرد|المطرود)/.test(t))return 'k';return null}
function headerOf(r){if((r||[]).some(function(c){var s=cleanCode(c);return /^\d{2,8}$/.test(s)}))return null;var cc=-1,nc=-1,dc=-1,sc=-1,ntc=-1,tc=-1,pp=-1,sp=-1,dcols=[];
  (r||[]).forEach(function(cell,j){var t=normAr(cell);if(!t&&!(cell instanceof Date))return;
    if(toDate(cell)&&!(typeof cell==='number'&&cell<30000)){dcols.push({j:j,date:toDate(cell)});return}
    if(pp<0&&/ولي/.test(t)){pp=j;return}
    if(sp<0&&/تليفون|موبايل|هاتف|phone|mobile/.test(t)){sp=j;return}
    if(cc<0&&/كود|code|^id$|رقم الطالب|^الرقم$|^رقم$/.test(t)){cc=j;return}
    if(nc<0&&/^(ال)?اسم|name/.test(t)){nc=j;return}
    if(dc<0&&/تاريخ|date|^اليوم$|وقت الحضور/.test(t)){dc=j;return}
    if(tc<0&&/^الوقت$|^وقت$|time|الساعه/.test(t)){tc=j;return}
    if(sc<0&&/حال|status|حضور|غياب/.test(t)){sc=j;return}
    if(ntc<0&&/ملاحظ|note|سبب/.test(t)){ntc=j;return}
  });
  if(cc>=0&&(nc>=0||sc>=0||dcols.length)||nc>=0&&(sc>=0||dcols.length))return {code:cc,name:nc,date:dc,status:sc,note:ntc,time:tc,pphone:pp,sphone:sp,dcols:dcols};
  return null}
function fmtTime(v){if(v==null||v==='')return '';var h,m;
  if(v instanceof Date){h=v.getHours();m=v.getMinutes()}
  else if(typeof v==='number'&&v<1){var mins=Math.round(v*1440);h=Math.floor(mins/60);m=mins%60}
  else{var s=digits(String(v)),mm=s.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm|ص|م)?/i);if(!mm)return '';h=+mm[1];m=+mm[2];var ap=(mm[3]||'').toLowerCase();if((ap==='pm'||ap==='م')&&h<12)h+=12;if((ap==='am'||ap==='ص')&&h===12)h=0}
  var pm=h>=12,h12=h%12||12;return h12+':'+pad(m)+' '+(pm?'م':'ص')}
function rowDate(r){for(var j=0;j<r.length;j++){var c=r[j];if(c instanceof Date||(typeof c==='string'&&/[\/\-.]/.test(c))){var d=toDate(c);if(d)return d}}return null}
function parseTable(rows){
  var cols=null,sect=null,ctxDate=null,found=false;
  var out={raw:[],skipped:[],listedPresent:false,usedDefault:false},hasStatus=false;
  rows.forEach(function(r){r=r||[];
    var sec=sectionOf(r);if(sec){sect=sec;hasStatus=true;return}
    var hd=headerOf(r);if(hd){cols=hd;found=true;return}
    if(!cols){var d=rowDate(r);if(d&&!ctxDate)ctxDate=d;return}
    var code=cols.code>=0?cleanCode(r[cols.code]):'',name=cols.name>=0?fixName(r[cols.name]):'';
    if(!code&&!name)return;
    if(LABEL_RE.test(normAr(name))||LABEL_RE.test(normAr(code)))return;
    if(code&&!/^\d+$/.test(code)&&!name)return;
    var note=cols.note>=0?String(r[cols.note]||'').trim():'';
    var tm=cols.time>=0?fmtTime(r[cols.time]):'';
    var extra={pphone:cols.pphone>=0?cleanCode(r[cols.pphone]):'',sphone:cols.sphone>=0?cleanCode(r[cols.sphone]):''};
    var line=[code,name].filter(Boolean).join(' - ');
    if(cols.dcols.length){cols.dcols.forEach(function(dc){var v=r[dc.j];var st=toStatus(v);if(st){hasStatus=true;out.raw.push({code:code,name:name,date:dc.date,st:st,n:note,line:line,x:extra})}else if(v!==''&&v!=null&&String(v).trim()){out.skipped.push({text:line+' ('+fmtD(dc.date)+'): '+v,why:'الحالة مش مفهومة'})}});return}
    var st=cols.status>=0?toStatus(r[cols.status]):null;
    if(!st&&sect)st=sect;
    if(cols.status>=0&&!st&&!sect){var rv=r[cols.status];out.skipped.push({text:line+(rv?': '+rv:''),why:rv?'الحالة مش مفهومة':'خانة الحالة فاضية'});return}
    if(st)hasStatus=true;
    var date=cols.date>=0?toDate(r[cols.date]):null;if(!date)date=rowDate(r);
    if(!date){date=ctxDate||'@default';if(!ctxDate)out.usedDefault=true}
    if(st==='p'&&tm&&!note)note='وصل الساعة '+tm;
    out.raw.push({code:code,name:name,date:date,st:st||'p',n:note,line:line,x:extra});
  });

  if(!hasStatus&&out.raw.length){out.listedPresent=true;out.usedDefault=true;out.raw.forEach(function(x){x.date='@default';x.st='p'})}

  var dates={};out.raw.forEach(function(x){if(x.date!=='@default')dates[x.date]=1});var dk=Object.keys(dates);

  return out;
}

/* PDF (or anything without clear headers): token-based rows */
function parseLoose(rows){
  var codes={};(S.students||[]).forEach(function(s){codes[String(s.code)]=1});
  var out={raw:[],skipped:[],listedPresent:false,usedDefault:false},dateHeaders=[],ctxDate=null,pending=[],anyStatus=false;
  rows.forEach(function(cells){
    var toks=fixName(cells.join(' ')).split(/\s+/).filter(Boolean);
    if(!toks.length)return;
    var dates=[],sts=[],code='',nameParts=[];
    toks.forEach(function(t){var d=toDate(t),st=toStatus(t),dt=digits(t);
      if(d){dates.push(d);return}
      if(st&&!/^\d+$/.test(dt)){if(st==='e'&&sts.length&&sts[sts.length-1]==='a'&&/عذر/.test(normAr(t)))sts[sts.length-1]='e';else sts.push(st);return}
      if(isCodeTok(dt)){if(!code||(codes[dt]&&!codes[code]))code=dt;return}
      if(/[؀-ۿa-zA-Z]/.test(t))nameParts.push(t);
    });
    var name=fixName(nameParts.join(' '));
    if(!code&&!sts.length){if(dates.length>=2)dateHeaders=dates;else if(dates.length===1)ctxDate=dates[0];return}
    if(!code){var nm=normAr(name),hit=(S.students||[]).find(function(s){return nm&&normAr(s.name)===nm});if(hit)code=String(hit.code);else{if(sts.length&&nameParts.length>=2)out.skipped.push({text:toks.join(' '),why:'ملقيتش كود الطالب'});return}}
    var line=code+(name?' - '+name:'');
    if(sts.length)anyStatus=true;
    if(dates.length&&sts.length===1){out.raw.push({code:code,name:name,date:dates[0],st:sts[0],n:'',line:line});return}
    if(dateHeaders.length&&sts.length>1){if(sts.length!==dateHeaders.length){out.skipped.push({text:line,why:'عدد الخانات مش مطابق لعدد الأيام'});return}
      sts.forEach(function(st,i){out.raw.push({code:code,name:name,date:dateHeaders[i],st:st,n:'',line:line})});return}
    if(sts.length===1){out.raw.push({code:code,name:name,date:ctxDate||'@default',st:sts[0],n:'',line:line});if(!ctxDate)out.usedDefault=true;return}
    if(sts.length>1){out.skipped.push({text:line,why:'فيه أكتر من حالة ومفيش تواريخ في أول الجدول'});return}
    pending.push({code:code,name:name,line:line});
  });
  if(!anyStatus&&pending.length){out.listedPresent=true;out.usedDefault=true;pending.forEach(function(p){out.raw.push({code:p.code,name:p.name,date:ctxDate||'@default',st:'p',n:'',line:p.line})})}
  return out;
}

function resolveUpload(){
  var parsed=up.kind==='pdf'?parseLoose(up.rows):(function(){var all={raw:[],skipped:[],listedPresent:false,usedDefault:false};
    up.rows.forEach(function(sheet){var p=parseTable(sheet)||parseLoose(sheet.map(function(r){return (r||[]).filter(function(c){return c!==''&&c!=null}).map(function(c){return c instanceof Date?toDate(c):c})}));
      all.raw=all.raw.concat(p.raw);all.skipped=all.skipped.concat(p.skipped);all.listedPresent=all.listedPresent||p.listedPresent;all.usedDefault=all.usedDefault||p.usedDefault});return all})();
  if(!up.gradeTouched){var g=detectGrade(up.file+' '+(up.kind==='pdf'?up.rows.slice(0,3):(up.rows[0]||[]).slice(0,3)).map(function(r){return (r||[]).join(' ')}).join(' '));if(!g){var cells=[];(up.kind==='pdf'?[up.rows]:up.rows).forEach(function(sh){sh.forEach(function(r){(r||[]).forEach(function(c){if(String(c).length<=30)cells.push(c)})})});for(var gi=0;gi<cells.length&&!g;gi++){g=detectGrade(cells[gi])}}if(g)up.grade=g}

  (S.students||[]).forEach(function(s){if(/\(مثال\)/.test(s.name))return;byCode[String(s.code)]=s;var n=normAr(s.name);nameIdx[n]=nameIdx[n]?'@dup':String(s.code)});
  var seen={};
  parsed.raw.forEach(function(x){
    var code=x.code,date=x.date==='@default'?def:x.date;
    if(!code&&x.name){var c=nameIdx[normAr(x.name)];if(c&&c!=='@dup')code=c}
    if(!code){res.skipped.push({text:x.line||x.name,why:'مفيش كود للطالب ده والاسم مش موجود'});return}
    if(!byCode[code]){
      if(up.addNew!==false&&x.name){if(!newStu[code]){newStu[code]={code:code,name:x.name,grade:up.grade||'',group:'',phone:''};res.newStudents.push(newStu[code])}}
      else{res.skipped.push({text:x.line||code,why:x.name?'الكود مش موجود في الطلاب':'الكود مش موجود ومفيش اسم في الشيت'});return}
    }
    if(byCode[code]&&!byCode[code].grade&&up.grade){res.gradeFill=res.gradeFill||{};res.gradeFill[code]=1}
    var key=code+'|'+date;if(seen[key])res.records[seen[key]-1]={code:code,name:x.name,date:date,st:x.st,n:x.n};else{res.records.push({code:code,name:x.name,date:date,st:x.st,n:x.n});seen[key]=res.records.length}
  });

    var inList={};res.records.forEach(function(r){inList[r.code]=1});
    (S.students||[]).forEach(function(s){if(s.grade===up.grade&&!inList[String(s.code)]&&!/\(مثال\)/.test(s.name)){res.records.push({code:String(s.code),name:s.name,date:def,st:'a',n:''});res.absentees++}});
  }

function loadScript(src,check){if(check())return Promise.resolve();return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=function(){res()};s.onerror=function(){rej(new Error('lib'))};document.head.appendChild(s)})}
var XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
var PDF_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',PDFW_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function fileDate(name){var fm=digits(name).match(/(\d{1,2})[-.](\d{1,2})(?:[-.](\d{2,4}))?/);if(!fm)return '';var fy=fm[3]?(+fm[3]<100?2000+ +fm[3]:+fm[3]):new Date().getFullYear();return ymd(fy,+fm[2],+fm[1])||''}
function parseFile(file){
  var isPdf=/\.pdf$/i.test(file.name)||file.type==='application/pdf';
  return file.arrayBuffer().then(function(buf){
    if(isPdf){
      return loadScript(PDF_URL,function(){return window.pdfjsLib||window['pdfjs-dist/build/pdf']}).then(function(){return loadScript(PDFW_URL,function(){return window.pdfjsWorker})}).then(function(){
        var lib=window.pdfjsLib||window['pdfjs-dist/build/pdf'];try{lib.GlobalWorkerOptions.workerSrc=PDFW_URL}catch(x){}
        return lib.getDocument({data:new Uint8Array(buf)}).promise;
      }).then(function(pdf){
        var ps=[];for(var i=1;i<=pdf.numPages;i++)ps.push(pdf.getPage(i).then(function(p){return p.getTextContent()}));
        return Promise.all(ps);
      }).then(function(pages){
        var rows=[];
        pages.forEach(function(tc){var lines=[];
          tc.items.forEach(function(it){if(!it.str||!it.str.trim())return;var y=it.transform[5],x=it.transform[4];
            var ln=lines.find(function(l){return Math.abs(l.y-y)<4});if(!ln){ln={y:y,items:[]};lines.push(ln)}ln.items.push({x:x,s:it.str})});
          lines.sort(function(a,b){return b.y-a.y}).forEach(function(l){rows.push(l.items.sort(function(a,b){return b.x-a.x}).map(function(i){return i.s}))});
        });
        if(!rows.length)throw {user:'الـ PDF ده مفيهوش كلام ينفع يتقرا (غالباً صورة متصورة). صدّره من Excel كـ PDF أو ارفع ملف الـ Excel نفسه.'};
        up.kind='pdf';up.rows=rows;
      });
    }
    return loadScript(XLSX_URL,function(){return window.XLSX}).then(function(){
      var wb=XLSX.read(new Uint8Array(buf),{type:'array',cellDates:true});
      up.kind='sheet';up.rows=wb.SheetNames.map(function(n){return XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})});
    });
  });
}
function errText(err){return (err&&err.user)||(err&&err.message==='lib'?'مقدرتش أحمّل أداة قراءة الملفات. اتأكد من النت وجرب تاني.':'مقدرتش أقرا الملف ده. اتأكد إنه Excel أو PDF سليم.')}
function readFile(file){
  up.file=file.name;up.status='loading';up.res=null;up.gradeTouched=false;up.batch=null;
  var fd=fileDate(file.name);if(fd)up.date=fd;
  render();
  parseFile(file).then(function(){resolveUpload();render()}).catch(function(err){up.status='error';up.msg=errText(err);render()});
}
/* several files at once: read each, show one summary, save all together */
function readMany(files){
  var baseDate=up.date||today(),baseGrade=up.gradeTouched?up.grade:'';
  var b={items:[],total:files.length,done:0,running:true,baseDate:baseDate,baseGrade:baseGrade};
  up.batch=b;up.status='batch';up.res=null;render();
  var i=0;
  (function next(){
    if(i>=files.length){b.running=false;up.date=baseDate;up.grade=baseGrade;up.gradeTouched=!!baseGrade;render();return}
    var f=files[i++];
    up.file=f.name;up.date=fileDate(f.name)||baseDate;up.grade=baseGrade;up.gradeTouched=!!baseGrade;up.rows=null;up.kind='';
    parseFile(f).then(function(){resolveUpload();var r=up.res;
      b.items.push({file:f.name,res:r,grade:up.grade,date:up.date,ok:r.records.length>0,err:r.records.length?'':'ملقيتش فيه حضور أو غياب'});
    }).catch(function(err){b.items.push({file:f.name,ok:false,err:errText(err)})}).then(function(){b.done++;up.status='batch';up.res=null;try{render()}catch(e){console.error('batch render',e)}next()});
  })();
}
function batchHtml(){
  var b=up.batch;if(!b)return '';
  var h='<div class="panel" style="margin-top:0;gap:10px"><h3>'+ic('upload',18)+' رفع '+b.total+' ملف مع بعض</h3>';
  if(b.running)h+='<div class="msg info">جاري قراءة الملفات… <b class="num">'+b.done+'</b> من <b class="num">'+b.total+'</b></div><div class="meter"><i style="width:'+Math.round(b.done/b.total*100)+'%"></i></div>';
  h+='<div class="list">';
  b.items.forEach(function(it){
    if(!it.ok){h+='<div class="li"><div class="grow"><b>'+esc(it.file)+'</b><small style="color:var(--bad)">'+esc(it.err)+' · مش هيتسجل</small></div><span class="chip a">اتخطى</span></div>';return}
    var r=it.res,ds=r.records.map(function(x){return x.date}).sort(),c={p:0,a:0,l:0,e:0,k:0};r.records.forEach(function(x){c[x.st]++});
    var dateTxt=fmtD(ds[0])+(ds[0]!==ds[ds.length-1]?' - '+fmtD(ds[ds.length-1]):'');
    h+='<div class="li"><div class="grow"><b>'+esc(it.file)+'</b><small class="num">'+dateTxt+' · '+esc(it.grade||'من غير مرحلة')+' · حضور '+c.p+' · غياب '+c.a+(c.l?' · تأخير '+c.l:'')+(c.e?' · بعذر '+c.e:'')+(c.k?' · طرد '+c.k:'')+(r.newStudents.length?' · '+r.newStudents.length+' طالب جديد':'')+'</small>'+
      (r.usedDefault?'<small style="color:var(--late)">الملف مفيهوش تاريخ، هيتسجل يوم '+fmtD(it.date)+'</small>':'')+'</div><span class="chip p num">'+r.records.length+'</span></div>';
  });
  h+='</div>';
  if(!b.running){var okN=b.items.filter(function(x){return x.ok}).length,tot=b.items.reduce(function(a,x){return a+(x.ok?x.res.records.length:0)},0);
    if(okN)h+='<div class="msg ok">جاهز: <b class="num">'+okN+'</b> ملف فيهم <b class="num">'+tot+'</b> تسجيل.</div>';
    h+='<div class="row">'+(okN?'<button class="btn main" data-act="applyBatch" '+(saving?'disabled':'')+'>اعتماد وحفظ كل الملفات</button>':'')+'<button class="btn plain sm" data-act="cancelUpload">إلغاء</button></div>';}
  return h+'</div>';
}
function applyBatch(){
  var b=up.batch;if(!b||b.running)return;var n=0,tot=0;
  b.items.forEach(function(it){if(!it.ok)return;applyRes(it.res,it.file,it.grade);n++;tot+=it.res.records.length});
  up={status:'',msg:'',file:'',rows:null,kind:'',res:null,date:b.baseDate,grade:b.baseGrade,gradeTouched:!!b.baseGrade,addNew:up.addNew};
  markDirty();save();toast('اتسجل '+n+' ملف ('+tot+' تسجيل)');
}
function applyUpload(){
  var r=up.res;if(!r||!r.records.length)return;
  applyRes(r,up.file,up.grade);
  up={status:'',msg:'',file:'',rows:null,kind:'',res:null,date:up.date,grade:up.grade,addNew:up.addNew};
  markDirty();save();
}
function applyRes(r,file,grade){
  var demo=S.students.filter(function(s){return /\(مثال\)/.test(s.name)});demo.forEach(function(s){delete S.attendance[s.code]});S.students=S.students.filter(function(s){return demo.indexOf(s)<0});
  r.newStudents.forEach(function(s){if(!S.students.some(function(o){return String(o.code)===s.code}))S.students.push(s)});
  Object.keys(r.gradeFill||{}).forEach(function(c){var s=S.students.find(function(o){return String(o.code)===c});if(s&&!s.grade)s.grade=grade});
  (r.phones||[]).forEach(function(pc){var s=S.students.find(function(o){return String(o.code)===pc[0]});if(s&&!s.phone)s.phone=pc[1]});
  r.records.forEach(function(x){S.attendance[x.code]=S.attendance[x.code]||{};S.attendance[x.code][x.date]={s:x.st,n:x.n||''}});
  var ds=r.records.map(function(x){return x.date}).sort();
  var recs={};r.records.forEach(function(x){(recs[x.date]=recs[x.date]||[]).push(x.code)});
  S.uploads=S.uploads||[];S.uploads.unshift({file:file,at:today(),count:r.records.length,recs:recs,dates:ds.filter(function(x,i){return ds.indexOf(x)===i}),range:ds[0]===ds[ds.length-1]?fmtD(ds[0]):fmtD(ds[0])+' - '+fmtD(ds[ds.length-1])});
  trimUploads();
}

var ex={title:'',date:'',max:'',status:'',msg:'',file:'',parsed:null,res:null},exDel=null;
function gradeCls(p){return p>=85?'g-a':p>=65?'g-b':p>=50?'g-c':'g-d'}
function fmtNum(n){return (Math.round(n*100)/100).toString()}
function examList(code,d){var m=(d.exams||{})[code]||{};return Object.keys(m).map(function(k){var x=m[k];return {id:k,t:x.t,d:x.d,s:x.s,m:x.m,n:x.n||''}}).sort(function(a,b){return (b.d||'').localeCompare(a.d||'')})}
function examsHtml(d,stu){

  var h='<section class="exams"><div class="exams-head"><h3>'+ic('award',20)+' درجات الامتحانات</h3>'+(avg!=null?'<span class="ex-avg">المتوسط <b class="num '+gradeCls(avg)+'" style="color:var(--c)">'+avg+'%</b></span>':'')+'</div>';

  var h='<h3>'+ic('chart',18)+' عدد الزيارات</h3><p class="hint">الصفحة دي بتظهرلك إنت بس (الأدمن). الزيارة بتتحسب مرة واحدة لكل ولي أمر لما يفتح الموقع، والبحث بيتحسب لما يدوّر على كود طالب موجود. زياراتك إنت والموظفين مش بتتحسب.</p>';
  if(statsErr==='rules')return h+'<div class="warn">لازم تحدّث قواعد Firebase (Rules) الأول عشان العداد يشتغل. الخطوات في الرسالة اللي بعتهالك.</div><button class="btn plain sm" data-act="reloadStats">جرب تاني</button>';
  if(statsErr)return h+'<div class="msg err">مقدرتش أجيب الأرقام. اتأكد من النت.</div><button class="btn plain sm" data-act="reloadStats">جرب تاني</button>';
  if(!STATS)return h+'<div class="msg info">جاري تحميل الأرقام…</div>';
  var sum=function(n,k){var t=0;for(var i=0;i<n;i++){var d=STATS.days[dayKey(i)];if(d)t+=d[k]||0}return t};
  var td=STATS.days[dayKey(0)]||{v:0,q:0},yd=STATS.days[dayKey(1)]||{v:0,q:0};
  h+='<div class="tiles num" style="margin-top:0"><div class="tile"><small>النهارده</small><b>'+td.v+'</b></div><div class="tile"><small>امبارح</small><b>'+yd.v+'</b></div><div class="tile"><small>آخر 7 أيام</small><b>'+sum(7,'v')+'</b></div><div class="tile"><small>آخر 30 يوم</small><b>'+sum(30,'v')+'</b></div><div class="tile"><small>الإجمالي من البداية</small><b>'+STATS.total.v+'</b></div><div class="tile p"><small>بحث عن طلاب (الإجمالي)</small><b>'+STATS.total.q+'</b></div></div>';
  var rows=[],mx=1;for(var i=13;i>=0;i--){var k=dayKey(i),d=STATS.days[k]||{v:0,q:0};rows.push([k,d]);if(d.v>mx)mx=d.v}
  h+='<h3>آخر 14 يوم</h3><div class="vchart">';
  rows.forEach(function(r){var pc=Math.round(r[1].v/mx*100);h+='<div class="vbar" title="'+fmtD(r[0])+': '+r[1].v+' زيارة، '+r[1].q+' بحث"><span class="num">'+r[1].v+'</span><i style="height:'+Math.max(pc,r[1].v?4:1)+'%"></i><small>'+(+r[0].slice(8))+'</small></div>'});
  h+='</div><div class="list">';
  rows.slice().reverse().forEach(function(r){h+='<div class="li"><div class="grow"><b>'+dayName(r[0])+' '+fmtD(r[0])+'</b></div><span class="num">'+r[1].v+' زيارة · '+r[1].q+' بحث</span></div>'});
  return h+'</div><button class="btn plain sm" data-act="reloadStats" style="align-self:flex-start">تحديث الأرقام</button>';
}

/* ---------- recycle bin: every delete keeps a copy you can bring back ---------- */
var restoreAsk='';
function packTrash(o){var t=JSON.stringify(o);return t.length<900000?t:''}
function snapStudents(list){var o={students:[],attendance:{},exams:{}};list.forEach(function(s){o.students.push(clone(s));if(S.attendance[s.code])o.attendance[s.code]=clone(S.attendance[s.code]);if(S.exams&&S.exams[s.code])o.exams[s.code]=clone(S.exams[s.code])});return packTrash(o)}
function trimUploads(){var keep=[],n=0;(S.uploads||[]).forEach(function(u){if(!u.id)u.id='n'+Date.now()+Math.random().toString(36).slice(2,7);if(u.trash||n<50){keep.push(u);if(!u.trash)n++}});S.uploads=keep}
function canRestore(){return me&&(me.role==='admin'||(me.perms||[]).indexOf('del')>=0)}
function mergeData(o){var have={},c={stu:0,att:0,ex:0};(S.students||[]).forEach(function(s){have[String(s.code)]=1});
  (o.students||[]).forEach(function(s){if(!have[String(s.code)]){S.students.push(clone(s));have[String(s.code)]=1;c.stu++}});
  Object.keys(o.attendance||{}).forEach(function(code){if(!have[code])return;var a=o.attendance[code];S.attendance[code]=S.attendance[code]||{};Object.keys(a).forEach(function(d){if(!S.attendance[code][d]){S.attendance[code][d]=a[d];c.att++}})});
  S.exams=S.exams||{};Object.keys(o.exams||{}).forEach(function(code){if(!have[code])return;var e=o.exams[code];S.exams[code]=S.exams[code]||{};Object.keys(e).forEach(function(k){if(!S.exams[code][k]){S.exams[code][k]=e[k];c.ex++}})});
  S.students.sort(function(a,b){return (parseInt(a.code,10)||0)-(parseInt(b.code,10)||0)});return c}
function trashHtml(){
  var L=(S.uploads||[]).filter(function(u){return u.trash});

  if(!L.length)h+='<p class="hint">مفيش حاجة محذوفة. أي حذف هتعمله من هنا ورايح هيظهر هنا وتقدر ترجعه بدوسة.</p>';

function doRestore(id){

function mergeFile(file){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.students)throw 0;var c=mergeData(d);

  S.uploads=S.uploads||[];S.uploads.unshift({file:'استرجاع من نسخة احتياطية: '+file.name,at:today(),count:c.stu});trimUploads();

function stOf(v){return v?(typeof v==='string'?v:v.s):''}
function absLimit(d){var n=parseInt((d||D()).site.absLimit,10);return n>=2&&n<=10?n:3}
function absInfo(att,refMonth){
  var ds=Object.keys(att||{}).sort(),streak=0,last='',mAbs=0,month=refMonth||today().slice(0,7);
  for(var i=ds.length-1;i>=0;i--){var st=stOf(att[ds[i]]);if(st==='e')continue;if(st==='a'){streak++;if(!last)last=ds[i]}else break}
  ds.forEach(function(x){if(x.slice(0,7)===month&&stOf(att[x])==='a')mAbs++});
  var lastAbs='';for(var j=ds.length-1;j>=0;j--){if(stOf(att[ds[j]])==='a'){lastAbs=ds[j];break}}
  return {streak:streak,month:mAbs,monthKey:month,lastAbs:lastAbs}}
function absFlag(inf,lim){return inf.streak>=lim||inf.month>=lim}
function absAlertHtml(d,stu){
  if(d.site.absParent===false)return '';

function shrinkSrc(src,maxW,limit){return new Promise(function(res){var img=new Image();img.onerror=function(){res(src)};img.onload=function(){var q=0.75,out=src;
  for(var k=0;k<6;k++){var sc=Math.min(1,maxW/img.width),cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);var x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);out=cv.toDataURL('image/jpeg',q);if(out.length<limit)break;if(q>0.55)q-=0.07;else maxW=Math.round(maxW*0.85)}
  res(out.length<src.length?out:src)};img.src=src})}
function lightenSite(){
  if(lightBusy)return;lightBusy=true;lightMsg='';render();
  var before=0,after=0,n=0;S.media=S.media||[];
  var jobs=S.media.map(function(m){before+=m.data.length;if(m.data.length<=300000){after+=m.data.length;return Promise.resolve()}
    return shrinkSrc(m.data,1300,300000).then(function(out){if(out!==m.data){m.data=out;n++}after+=m.data.length})});
  Promise.all(jobs).then(function(){
    var cut=new Date();cut.setDate(cut.getDate()-30);var ck=cut.getFullYear()+'-'+pad(cut.getMonth()+1)+'-'+pad(cut.getDate()),tr=0;
    S.uploads=(S.uploads||[]).filter(function(u){if(u.trash&&u.at&&u.at<ck){tr++;return false}return true});
    var kb=function(x){return Math.round(x*0.75/1024)};
    lightMsg='الصور: '+(n?'اتضغط '+n+' صورة، من '+kb(before)+' ك.ب لـ '+kb(after)+' ك.ب':'كلها خفيفة أصلاً ('+kb(before)+' ك.ب)')+(tr?' · اتمسح '+tr+' من المحذوفات القديمة (أقدم من 30 يوم)':'')+'.';
    lightBusy=false;markDirty();save();
  }).catch(function(){lightBusy=false;lightMsg='حصلت مشكلة، جرب تاني.';render()});
}

  return '<hr class="sep"><h3>'+ic('chart',18)+' تخفيف الموقع</h3><p class="hint">دوس الزرار ده كل فترة. بيضغط صور الجداول التقيلة عشان تفتح أسرع عند أولياء الأمور، وبيمسح المحذوفات اللي عدى عليها أكتر من 30 يوم، وبيحفظ على طول.</p>'+

  '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="noMotion" '+(s.noMotion?'checked':'')+'> وقّف الحركات في الموقع عند كل الناس (أخف على الموبايلات الضعيفة)</label>';

/* ---------- weekly timetable per stage (built by hand) ---------- */
var TT_DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'],ttStage=null,confirmTT=false;
function fmt12(t){var m=String(t||'').match(/^(\d{1,2}):(\d{2})/);if(!m)return String(t||'');var h=+m[1],mm=m[2];return (h%12||12)+':'+mm+' '+(h>=12?'م':'ص')}
function ttRows(d,stage){var tt=(d.site.tt||{})[stage]||[];return tt.filter(function(r){return r.subject||r.teacher||r.from}).slice().sort(function(a,b){return (TT_DAYS.indexOf(a.day)-TT_DAYS.indexOf(b.day))||String(a.from||'').localeCompare(String(b.from||''))})}
function ttTable(rows){var h='<table class="tt"><thead><tr><th>اليوم</th><th>المادة</th><th>المدرس</th><th>الميعاد</th></tr></thead><tbody>';
  rows.forEach(function(r,i){var first=i===0||rows[i-1].day!==r.day,span=0;if(first){for(var j=i;j<rows.length&&rows[j].day===r.day;j++)span++}
    h+='<tr'+(first&&i?' class="newday"':'')+'>'+(first?'<td class="tt-day" rowspan="'+span+'">'+esc(r.day)+'</td>':'')+'<td class="tt-sub">'+esc(r.subject||'—')+'</td><td>'+esc(r.teacher||'—')+'</td><td class="tt-time">'+esc(r.from?fmt12(r.from)+(r.to?' – '+fmt12(r.to):''):'—')+'</td></tr>'});
  return h+'</tbody></table>'}
function ttHtml(d,stu){var out='',stages=[];if(stu&&stu.grade)stages.push(stu.grade);stages.push('');
  stages.forEach(function(g){var rows=ttRows(d,g);if(!rows.length)return;
    out+='<section class="tbl-card"><h3>'+ic('text',18)+' '+(g?'جدول حصص '+esc(g):esc(d.site.ttAllTitle||'جدول الحصص'))+'</h3><div class="ttable">'+ttTable(rows)+'</div></section>'});
  return out}

  var h='<h3>'+ic('text')+' جدول الحصص لكل مرحلة</h3><p class="hint">اختار المرحلة، وضيف الحصص: اليوم والمادة والمدرس والميعاد. الموقع بيرتبهم لوحده بالأيام ويعرضهم كجدول لولي أمر المرحلة دي بس. وبعد ما تخلص دوس "حفظ" تحت.</p>';
  h+='<div class="tt-stages">'+gs.concat(['']).map(function(g){var n=ttRows(S,g).length;return '<button class="chip-btn'+(g===ttStage?' on':'')+'" data-act="ttStage" data-g="'+esc(g)+'">'+esc(g||'كل المراحل')+(n?' <span class="num">('+n+')</span>':'')+'</button>'}).join('')+'</div>';

  if(!rows.length)h+='<div class="empty">لسه مفيش حصص في المرحلة دي. دوس "إضافة حصة".</div>';
  rows.forEach(function(r,i){h+='<div class="tt-row"><div class="field"><label for="td'+i+'">اليوم</label><select id="td'+i+'" data-tt="'+i+'|day">'+TT_DAYS.map(function(dn){return '<option'+(dn===r.day?' selected':'')+'>'+dn+'</option>'}).join('')+'</select></div>'+
    '<div class="field grow2"><label for="ts'+i+'">المادة</label><input type="text" id="ts'+i+'" data-tt="'+i+'|subject" value="'+esc(r.subject||'')+'" placeholder="مثلاً: رياضيات"></div>'+
    '<div class="field grow2"><label for="tm'+i+'">المدرس</label><input type="text" id="tm'+i+'" data-tt="'+i+'|teacher" value="'+esc(r.teacher||'')+'" placeholder="مثلاً: أ/ محمد"></div>'+
    '<div class="field"><label for="tf'+i+'">من</label><input type="time" id="tf'+i+'" data-tt="'+i+'|from" value="'+esc(r.from||'')+'"></div>'+
    '<div class="field"><label for="tto'+i+'">إلى (اختياري)</label><input type="time" id="tto'+i+'" data-tt="'+i+'|to" value="'+esc(r.to||'')+'"></div>'+
    '<button class="btn danger sm" data-act="rmTT" data-i="'+i+'" aria-label="حذف الحصة">'+ic('trash',14)+'</button></div>'});
  h+='<div class="row"><button class="btn acc" data-act="addTT">'+ic('plus',16)+' إضافة حصة</button>'+(rows.length?'<button class="btn plain sm" data-act="clearTT">مسح جدول المرحلة دي</button>':'')+'</div></div>';
  var pv=ttRows(S,ttStage);if(pv.length)h+='<p class="hint">شكل الجدول عند ولي الأمر:</p><div class="ttable tt-preview">'+ttTable(pv)+'</div>';
  if(ttStage==='')h+='<div class="row">'+inp('ttAllTitle','عنوان جدول "كل المراحل"',s.ttAllTitle||'جدول الحصص')+'</div>';
  return h;
}


/* ---------- parents' rating of the system (stars + optional reason) ---------- */
var rate={stars:0,sent:false,busy:false,text:''},RATINGS=null,ratingsErr='';
try{var _r=localStorage.getItem('c3m_rated');if(_r&&Date.now()-(+_r)<30*864e5)rate.sent=true}catch(e){}
var RATE_WORDS=['','ضعيف','مقبول','جيد','جيد جدًا','ممتاز'];
function starsRow(n,act,size){var h='<div class="stars'+(act?' pick':'')+'" role="'+(act?'radiogroup':'img')+'" aria-label="'+n+' من 5">';for(var i=1;i<=5;i++)h+=act?'<button class="st'+(i<=n?' on':'')+'" data-act="rateStar" data-n="'+i+'" aria-label="'+i+' نجوم">'+ic('star',size||34)+'</button>':'<span class="st'+(i<=n?' on':'')+'">'+ic('star',size||16)+'</span>';return h+'</div>'}
function rateHtml(stu){
  var h='<section class="rate" id="rateBox"><h3>ما رأيك في نظام المتابعة؟</h3>';
  if(rate.sent)return h+'<p class="rate-thanks">'+ic('check',20)+' شكرًا لرأيك، بيساعدنا نطوّر الخدمة 🌟</p></section>';
  h+='<p class="hint">رأيك بيفرق معانا، وبياخد ثانية واحدة.</p>'+starsRow(rate.stars,true)+(rate.stars?'<div class="rate-word">'+RATE_WORDS[rate.stars]+'</div>':'');
  if(rate.stars&&rate.stars<5)h+='<div class="field rate-why"><label for="rateTxt">إيه اللي نقدر نحسّنه؟ (اختياري)</label><textarea id="rateTxt" maxlength="500" placeholder="اكتب ملاحظتك هنا…">'+esc(rate.text)+'</textarea></div>';
  if(rate.stars)h+='<button class="btn main" data-act="rateSend" '+(rate.busy?'disabled':'')+'>'+(rate.busy?'جاري الإرسال…':'إرسال التقييم')+'</button>';
  return h+'</section>';
}
function refreshRate(){var el=document.getElementById('rateBox');if(!el)return;var w=document.createElement('div');w.innerHTML=rateHtml(curStu());el.replaceWith(w.firstChild)}
function sendRate(){
  var tx=val('rateTxt').trim().slice(0,500),stu=curStu();rate.text=tx;rate.busy=true;refreshRate();
  var doc={stars:rate.stars,text:rate.stars<5?tx:'',grade:(stu&&stu.grade)||'',ts:firebase.firestore.FieldValue.serverTimestamp()};
  db.collection('ratings').add(doc).then(function(){rate.busy=false;rate.sent=true;try{localStorage.setItem('c3m_rated',String(Date.now()))}catch(e){}refreshRate()})
  .catch(function(){rate.busy=false;refreshRate();toast('مقدرناش نبعت التقييم دلوقتي، جرب تاني بعد شوية')});
}
function loadRatings(){return db.collection('ratings').orderBy('ts','desc').limit(500).get().then(function(qs){var L=[];qs.forEach(function(d){var x=d.data();x.id=d.id;L.push(x)});RATINGS=L;ratingsErr='';if(adminTab==='ratings')render()}).catch(function(e){ratingsErr=e&&e.code==='permission-denied'?'rules':'err';if(adminTab==='ratings')render()})}
var ratFilter=0;
function tsDate(t){try{var d=t&&t.toDate?t.toDate():(typeof t==='number'?new Date(t):null);if(!d)return '';return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}catch(e){return ''}}
function pRatings(){
  var h='<h3>'+ic('star',18)+' آراء أولياء الأمور</h3><p class="hint">التقييمات اللي أولياء الأمور بعتوها من آخر الصفحة. بتظهرلك إنت بس.</p>';
  if(ratingsErr==='rules')return h+'<div class="warn">لازم تحدّث قواعد Firebase (Rules) الأول عشان التقييمات تشتغل. الخطوات في الرسالة.</div><button class="btn plain sm" data-act="reloadRatings">جرب تاني</button>';
  if(ratingsErr)return h+'<div class="msg err">مقدرتش أجيب التقييمات. اتأكد من النت.</div><button class="btn plain sm" data-act="reloadRatings">جرب تاني</button>';
  if(!RATINGS){loadRatings();return h+'<div class="msg info">جاري التحميل…</div>'}
  var L=RATINGS,n=L.length;if(!n)return h+'<div class="empty">لسه مفيش تقييمات.</div>';
  var sum=0,c=[0,0,0,0,0,0];L.forEach(function(r){sum+=r.stars;c[r.stars]=(c[r.stars]||0)+1});var avg=sum/n;
  h+='<div class="rat-sum"><div class="rat-avg"><b class="num">'+avg.toFixed(1)+'</b>'+starsRow(Math.round(avg),false,20)+'<small class="num">'+n+' تقييم</small></div><div class="rat-bars">';
  for(var k=5;k>=1;k--){var pc=Math.round(c[k]/n*100);h+='<button class="rat-bar'+(ratFilter===k?' on':'')+'" data-act="ratFilter" data-n="'+k+'"><span class="num">'+k+' ★</span><span class="rb"><i style="width:'+pc+'%"></i></span><span class="num">'+c[k]+'</span></button>'}
  h+='</div></div>';
  var F=L.filter(function(r){return !ratFilter||r.stars===ratFilter});
  h+='<div class="row" style="justify-content:space-between"><b>'+(ratFilter?'تقييمات '+ratFilter+' نجوم ('+F.length+')':'كل التقييمات')+'</b>'+(ratFilter?'<button class="btn plain sm" data-act="ratFilter" data-n="0">عرض الكل</button>':'')+'<button class="btn plain sm" data-act="reloadRatings">تحديث</button></div><div class="list">';
  F.forEach(function(r){var dd=tsDate(r.ts);h+='<div class="li rat-item"><div class="grow">'+starsRow(r.stars,false,16)+(r.text?'<p class="rat-text">'+esc(r.text)+'</p>':'<small class="hint">'+(r.stars<5?'من غير تعليق':'')+'</small>')+'<small class="num">'+(dd?dayName(dd)+' '+fmtD(dd):'')+(r.grade?' · '+esc(r.grade):'')+'</small></div>'+(me.role==='admin'?'<button class="btn plain sm" data-act="rmRating" data-id="'+esc(r.id)+'" aria-label="حذف">'+ic('trash',14)+'</button>':'')+'</div>'});
  return h+'</div>';
}

function save(){
  if(!me){toast('لازم تدخل الأول');return}
  saving=true;render();
  var ops=[];
  if(stable(siteDoc(S))!==stable(siteDoc(STATE)))ops.push(function(b){b.set(db.doc('settings/site'),siteDoc(S))});
  (S.media||[]).forEach(function(m){var o=(STATE.media||[]).find(function(x){return x.id===m.id});if(!o||stable(o)!==stable(m)){var f=function(b){b.set(db.doc('settings/img_'+m.id),{caption:m.caption||'',stage:m.stage||'',data:m.data,order:m.order||0})};f.big=true;ops.push(f)}});
  (STATE.media||[]).forEach(function(o){if(!(S.media||[]).some(function(m){return m.id===o.id}))ops.push(function(b){b.delete(db.doc('settings/img_'+o.id))})});
  var codes={};(S.students||[]).concat(STATE.students||[]).forEach(function(s){codes[String(s.code)]=1});
  Object.keys(codes).forEach(function(c){var a=studentDoc(S,c),b0=studentDoc(STATE,c);
    if(!a&&b0)ops.push(function(b){b.delete(db.doc('students/'+c))});
    else if(a&&stable(a)!==stable(b0))ops.push(function(b){b.set(db.doc('students/'+c),a)})});
  if(me.role==='admin'){
    (S.users||[]).forEach(function(u){var o=(STATE.users||[]).find(function(x){return x.id===u.id});if(o&&stable(userDoc(o))!==stable(userDoc(u)))ops.push(function(b){b.set(db.doc('users/'+u.id),userDoc(u))})});
    (STATE.users||[]).forEach(function(o){if(!(S.users||[]).some(function(x){return x.id===o.id}))ops.push(function(b){b.delete(db.doc('users/'+o.id))})});
  }
  var oldIds={};(STATE.uploads||[]).forEach(function(u){oldIds[u.id]=1});
  (S.uploads||[]).forEach(function(u){if(!u.id)u.id='n'+Date.now()+Math.random().toString(36).slice(2,7);if(!oldIds[u.id]){var d=clone(u);delete d.id;d.by=me.u;d.ts=firebase.firestore.FieldValue.serverTimestamp();ops.push(function(b){b.set(db.collection('uploads').doc(u.id),d)})}});
  var newIds={};(S.uploads||[]).forEach(function(u){newIds[u.id]=1});
  (STATE.uploads||[]).forEach(function(u){if(!newIds[u.id])ops.push(function(b){b.delete(db.collection('uploads').doc(u.id))})});
  if(!ops.length){saving=false;dirty=false;render();toast('مفيش تغييرات');return}
  var chunks=[],cur=[];ops.forEach(function(f){if(f.big){chunks.push([f]);return}cur.push(f);if(cur.length>=15){chunks.push(cur);cur=[]}});if(cur.length)chunks.push(cur);if(chunks.length>3)toast('جاري الحفظ… ('+ops.length+' تغيير)');
  var done=0;
  chunks.reduce(function(pr,ch){return pr.then(function(){var b=db.batch();ch.forEach(function(f){f(b)});return b.commit().then(function(){done+=ch.length})})},Promise.resolve())
  .then(function(){STATE=clone(S);saving=false;dirty=false;render();toast('اتحفظ، وظهر لأولياء الأمور')})
  .catch(function(e){saving=false;render();toast(fbErr(e)+(done?' — اتحفظ جزء ('+done+' من '+ops.length+')، دوس حفظ تاني':''))});
}

/* ---------- boot ---------- */
var h=location.hash.replace('#','');if(h==='login'||h==='staff')view='login';
setTimeout(function(){if(!me&&view!=='login')countVisit('v')},1500);
render();
db.doc('settings/site').get().then(function(snap){if(me)return;if(snap.exists)siteFromDoc(snap.data(),STATE);S=clone(STATE);render();setTimeout(function(){loadMedia(null)},400)}).catch(function(){});
db.doc('meta/setup').get().then(function(s){setupDone=s.exists;render()}).catch(function(){setupDone=true;render()});
auth.onAuthStateChanged(function(user){if(user&&!me&&!loginBusy){loadMe(user.uid).then(function(){render()}).catch(function(){me=null;render()})}});
})();
</script>
